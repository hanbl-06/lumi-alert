<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-label="The Lumi Alert dashboard: a map of a lighting district with three dark fixtures flagged, beside a list of work orders with pole IDs and fault codes.">
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#FAFCFE"/>
    </linearGradient>
  </defs>

  <ellipse cx="320" cy="424" rx="210" ry="16" fill="#1D1D1F" opacity=".07"/>

  <!-- screen frame -->
  <rect x="48" y="36" width="544" height="356" rx="20" fill="#FFFFFF" stroke="#D8E3EE" stroke-width="2"/>
  <rect x="48" y="36" width="544" height="44" rx="20" fill="#F4F7FB"/>
  <rect x="48" y="66" width="544" height="14" fill="#F4F7FB"/>
  <circle cx="76" cy="58" r="5.5" fill="#E0A82A"/><circle cx="94" cy="58" r="5.5" fill="#8FCBF0"/><circle cx="112" cy="58" r="5.5" fill="#CDE6F8"/>
  <rect x="140" y="50" width="150" height="16" rx="8" fill="#E4ECF4"/>
  <text x="520" y="63" text-anchor="end" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1C6698">Sector 7 · live</text>
  <rect x="48" y="80" width="544" height="312" rx="0" fill="url(#scr)"/>

  <!-- map panel -->
  <rect x="68" y="98" width="302" height="276" rx="14" fill="#F8FBFE" stroke="#E8EEF5"/>
  <g stroke="#DCE9F5" stroke-width="1.5">
    <path d="M68 168h302M68 236h302M68 304h302"/>
    <path d="M146 98v276M224 98v276M302 98v276"/>
  </g>
  <g fill="#E0A82A">
    <circle cx="108" cy="134" r="5"/><circle cx="186" cy="134" r="5"/><circle cx="264" cy="134" r="5"/><circle cx="340" cy="134" r="5"/>
    <circle cx="108" cy="202" r="5"/><circle cx="264" cy="202" r="5"/><circle cx="340" cy="202" r="5"/>
    <circle cx="186" cy="270" r="5"/><circle cx="264" cy="270" r="5"/>
    <circle cx="108" cy="338" r="5"/><circle cx="186" cy="338" r="5"/><circle cx="340" cy="338" r="5"/>
  </g>
  <g>
    <circle cx="186" cy="202" r="6" fill="#D1524A"/>
    <circle cx="186" cy="202" r="15" fill="none" stroke="#D1524A" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="186" cy="202" r="26" fill="none" stroke="#D1524A" stroke-opacity=".22" stroke-width="2"/>
    <circle cx="108" cy="270" r="6" fill="#D1524A"/>
    <circle cx="108" cy="270" r="15" fill="none" stroke="#D1524A" stroke-opacity=".45" stroke-width="2"/>
    <circle cx="340" cy="270" r="6" fill="#D1524A"/>
    <circle cx="340" cy="270" r="15" fill="none" stroke="#D1524A" stroke-opacity=".45" stroke-width="2"/>
  </g>

  <!-- work-order list -->
  <text x="392" y="116" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1D1D1F">Open work orders</text>

  <g>
    <rect x="392" y="128" width="180" height="70" rx="12" fill="#FFFFFF" stroke="#E8EEF5"/>
    <circle cx="410" cy="150" r="5" fill="#D1524A"/>
    <text x="424" y="155" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1D1D1F">Pole 7-114</text>
    <text x="406" y="176" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#515661">E-204 driver failure</text>
    <text x="406" y="191" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#86868B">dark 11 min · bring 60W driver</text>
  </g>
  <g>
    <rect x="392" y="206" width="180" height="70" rx="12" fill="#FFFFFF" stroke="#E8EEF5"/>
    <circle cx="410" cy="228" r="5" fill="#E0A82A"/>
    <text x="424" y="233" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1D1D1F">Pole 7-032</text>
    <text x="406" y="254" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#515661">W-118 lumen drift 34%</text>
    <text x="406" y="269" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#86868B">failing · schedule this week</text>
  </g>
  <g>
    <rect x="392" y="284" width="180" height="70" rx="12" fill="#FFFFFF" stroke="#E8EEF5"/>
    <circle cx="410" cy="306" r="5" fill="#2E9E6B"/>
    <text x="424" y="311" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1D1D1F">Pole 7-087</text>
    <text x="406" y="332" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#515661">Restored 08:14</text>
    <text x="406" y="347" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#86868B">repaired in one visit</text>
  </g>

  <!-- stand -->
  <rect x="268" y="392" width="104" height="10" rx="5" fill="#D8E3EE"/>
